name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v6

      - name: Przygotuj Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Zainstaluj zależności
        run: npm ci

      - name: Sprawdź podatności zależności
        run: npm audit --omit=dev --audit-level=moderate

      - name: Sprawdź kod i uruchom testy
        run: npm run check

  database:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v6

      - name: Przygotuj Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Odtwórz migracje i uruchom testy bazy
        run: |
          supabase start
          supabase db reset --local
          supabase test db --local